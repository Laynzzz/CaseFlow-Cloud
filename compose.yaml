name: caseflow-local
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: caseflow_admin
      POSTGRES_DB: caseflow
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Run node scripts/init-local.mjs}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Local environment is required}
      DB_API_PASSWORD: ${DB_API_PASSWORD:?Local environment is required}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?Local environment is required}
    ports:
      - '127.0.0.1:54320:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/local/init-db.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caseflow_admin -d caseflow']
      interval: 3s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:e03b95891c214fba3ab72f12f40c983211549e817c5fce8d0f37761db04ae185
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run node scripts/generate-demo.mjs}
      KC_HOSTNAME: http://127.0.0.1:8180
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8180:8080'
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infrastructure/local/generated:/opt/keycloak/data/import:ro
  kafka:
    image: apache/kafka:4.2.1@sha256:2d2f77837385f202b1947fc3ed62421de344f0ced47dde360ca5afdad11b51fa
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - '127.0.0.1:9092:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 12
  object-store:
    image: chrislusf/seaweedfs:4.47@sha256:f83509b0721dfd8e2e07faf76c0a899f67a8a889c89abe2fa0a5227ba1320362
    command: ['mini', '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run node scripts/init-local.mjs}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run node scripts/init-local.mjs}
      S3_BUCKET: caseflow-local
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - object-data:/data
volumes:
  postgres-data:
  keycloak-data:
  kafka-data:
  object-data:
