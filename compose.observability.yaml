# Overlay: docker compose --env-file .env.release -f compose.release.yaml -f compose.observability.yaml ...
name: caseflow-release
services:
  api:
    environment:
      CASEFLOW_TRACING_EXPORT_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      CASEFLOW_TRACE_SAMPLE_RATE: ${CASEFLOW_TRACE_SAMPLE_RATE:-0.1}
  worker:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_EXPORTER: otlp
      CASEFLOW_TRACE_SAMPLE_RATE: ${CASEFLOW_TRACE_SAMPLE_RATE:-0.1}
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./infrastructure/observability/collector.yaml:/etc/otelcol/config.yaml:ro']
    ports: ['127.0.0.1:14318:4318']
    mem_limit: 256m
    read_only: true
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    depends_on:
      tempo: {condition: service_started}
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command: ['--config.file=/etc/prometheus/prometheus.yaml', '--storage.tsdb.path=/prometheus', '--storage.tsdb.retention.time=24h', '--storage.tsdb.retention.size=1GB']
    volumes:
      - ./infrastructure/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./infrastructure/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:19090:9090']
    mem_limit: 384m
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: ['127.0.0.1:13200:3200']
    mem_limit: 512m
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ['127.0.0.1:13000:3000']
    mem_limit: 384m
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    depends_on:
      prometheus: {condition: service_started}
      tempo: {condition: service_started}
volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
