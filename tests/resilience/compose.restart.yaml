# Only the opt-in restart harness uses this file; never merge into compose.yaml.
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: caseflow_admin
      POSTGRES_DB: caseflow
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Load the local environment}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Load the local environment}
      DB_API_PASSWORD: ${DB_API_PASSWORD:?Load the local environment}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?Load the local environment}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../../infrastructure/local/init-db.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caseflow_admin -d caseflow']
      interval: 2s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.2.1@sha256:2d2f77837385f202b1947fc3ed62421de344f0ced47dde360ca5afdad11b51fa
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - '127.0.0.1:19092:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1']
      interval: 3s
      timeout: 10s
      retries: 30
volumes:
  postgres-data:
  kafka-data:
