server:
  address: ${API_ADDRESS:127.0.0.1}
  port: ${API_PORT:8080}
spring:
  application:
    name: case-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://127.0.0.1:8180/realms/caseflow}
          jwk-set-uri: ${OIDC_JWKS:http://127.0.0.1:8180/realms/caseflow/protocol/openid-connect/certs}
          audiences: caseflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:54320/caseflow}
    username: caseflow_api
    password: ${DB_API_PASSWORD}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 5
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 5
  flyway:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:54320/caseflow}
    user: caseflow_migrator
    password: ${DB_MIGRATOR_PASSWORD}
    default-schema: public
    clean-disabled: true
  sql:
    init:
      mode: never
logging:
  structured:
    format:
      console: ecs
management:
  otlp:
    metrics:
      export:
        enabled: false # Prometheus scrapes metrics; the OTLP collector accepts traces only.
  server:
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${CASEFLOW_TRACE_SAMPLE_RATE:0.1}
    baggage:
      enabled: false
    export:
      enabled: ${CASEFLOW_TRACING_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318}/v1/traces
          connect-timeout: 2s
          timeout: 2s
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
