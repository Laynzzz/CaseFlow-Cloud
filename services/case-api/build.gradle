plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'dev.caseflow'
version = '0.1.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation platform('software.amazon.awssdk:bom:2.54.18')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation 'org.springframework.kafka:spring-kafka'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Package the centrally ordered SQL files into the application, without copying sources.
tasks.named('processResources') {
    from('../../db/migrations') { into 'db/migration'; include '*.sql' }
}

tasks.named('test') {
    useJUnitPlatform()
    // A file avoids Windows' process-command limit as the observability SDK grows.
    def runtimeClasspathFile = layout.buildDirectory.file('test-runtime-classpath.txt')
    systemProperty 'caseflow.test.runtimeClasspathFile', runtimeClasspathFile.get().asFile.absolutePath
    doFirst { runtimeClasspathFile.get().asFile.text = sourceSets.test.runtimeClasspath.asPath }
}
dependencyLocking { lockAllConfigurations() }
