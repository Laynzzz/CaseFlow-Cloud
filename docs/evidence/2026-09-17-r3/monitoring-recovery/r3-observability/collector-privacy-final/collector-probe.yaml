receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  filter/unsupported_content:
    error_mode: propagate
    traces:
      # Current application instrumentation propagates parent IDs, never span links.
      span:
        - Len(links) > 0
      spanevent:
        - 'true'
  transform/metadata_only:
    # Fail closed: a transformation error drops telemetry rather than exporting raw data.
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "deployment.environment.name"])
      - context: scope
        statements:
          - keep_keys(attributes, [])
      - context: span
        statements:
          - keep_keys(attributes, ["http.route", "http.request.method", "http.response.status_code", "http.method", "http.status_code", "job.kind", "outcome"])
          - delete_key(attributes, "job.kind") where attributes["job.kind"] != nil and not IsMatch(attributes["job.kind"], "^(DOCUMENT|INGESTION|EXTRACTION|REVIEW)$")
          - delete_key(attributes, "outcome") where attributes["outcome"] != nil and not IsMatch(attributes["outcome"], "^(succeeded|fenced|failed|deferred)$")
          - replace_pattern(attributes["http.route"], "[?].*", "") where attributes["http.route"] != nil
          - replace_pattern(attributes["http.route"], "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", "{id}") where attributes["http.route"] != nil
          - set(status.message, "")
          - set(trace_state, "")
          - set(name, "caseflow.operation") where not IsMatch(name, "^(api\\.(publish|complete)|worker\\.(schedule|execute|publish))$")
          - set(name, Concat([attributes["http.request.method"], attributes["http.route"]], " ")) where attributes["http.route"] != nil and attributes["http.request.method"] != nil
          - set(name, Concat([attributes["http.method"], attributes["http.route"]], " ")) where attributes["http.route"] != nil and attributes["http.method"] != nil
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  file:
    path: /output/sanitized.json
service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/unsupported_content, transform/metadata_only, batch]
      exporters: [file]
