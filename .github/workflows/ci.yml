name: PR gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      broad:
        description: Run the broader release crash suites
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pr-gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.2'
          terraform_wrapper: false
      - name: Install pinned dependencies and create synthetic environment
        run: |
          node scripts/ci.mjs bootstrap
          node scripts/ci.mjs install
      - name: Format, lint, typecheck, generated contracts and guard tests
        run: node scripts/ci.mjs check
      - name: Start isolated CI dependencies
        run: node scripts/ci.mjs up
      - name: Serial Java and Python integration with critical branch gate
        run: node scripts/ci.mjs test ${{ inputs.broad && '--broad' || '' }}
      - name: Build API/web and worker images
        if: ${{ !cancelled() }}
        run: node scripts/ci.mjs images
      - name: Secret, dependency and container scans
        if: ${{ !cancelled() }}
        run: node scripts/ci.mjs scan
      - name: Terraform format and offline-backend validation
        if: ${{ !cancelled() }}
        run: node scripts/ci.mjs terraform
      - name: Stop only the CI project and sanitize reports
        if: ${{ always() }}
        run: |
          node scripts/ci.mjs stop
          node scripts/ci.mjs redact
      - name: Preserve reviewable reports without snapshots, image tars or credentials
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-gate-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            output/ci/*.json
            output/ci/*.xml
            output/ci/*.txt
            output/ci/java-tests/*.xml
